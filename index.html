<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心悦量化平台 1.2 · 正在连接…</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d1117; color: #e6edf3;
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    text-align: center; padding: 20px;
  }
  .box { max-width: 420px; }
  .logo { margin-bottom: 12px; }
  .logo img { width: 84px; height: 84px; border-radius: 20px; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  .status { color: #8b98a9; font-size: 13px; min-height: 20px; margin-top: 10px; }
  .spinner {
    width: 30px; height: 30px; margin: 18px auto; border: 3px solid #232d3d;
    border-top-color: #3d8bff; border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .maint { color: #e6543e; font-size: 15px; font-weight: 700; }
  .tip { color: #8b98a9; font-size: 12px; margin-top: 14px; }
  a { color: #3d8bff; }
</style>
</head>
<body>
<div class="box">
  <div class="logo"><img src="./icon-192.png" alt="心悦量化"></div>
  <h1>心悦量化平台 1.2</h1>
  <div class="spinner" id="spin"></div>
  <div class="status" id="status">正在连接服务器…</div>
  <div class="tip">如果长时间无反应，请检查电脑端是否已启动服务，或稍后重试。</div>
</div>
<script>
/* 固定跳转页：从 GitHub API 实时读取心跳（raw CDN 缓存延迟太大，改用 API） */
var HEARTBEAT_URL = 'https://api.github.com/repos/1950558292a/xinyue-heartbeat/contents/heartbeat.json?t=' + Date.now();
var MAX_WAIT = 15000;
var start = Date.now();

function showMaint() {
  document.getElementById('spin').style.display = 'none';
  document.getElementById('status').innerHTML =
    '<div class="maint">暂时无法连接服务器</div>' +
    '请检查电脑端「心悦量化」服务是否已启动。<br>同一 WiFi 下可用 http://192.168.1.7:8080 访问。';
}
function showErr(msg) {
  document.getElementById('spin').style.display = 'none';
  document.getElementById('status').innerHTML = '连接失败：' + msg;
}

function decodeApiResp(j) {
  /* GitHub API 返回 { content: "base64..." } */
  if (j && j.content) {
    try {
      var bin = atob(j.content.replace(/\n/g, ''));
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder('utf-8').decode(bytes));
    } catch (e) { return null; }
  }
  return j && (j.url || j.ts) ? j : null;
}

function goto(j) {
  j = decodeApiResp(j);
  if (!j || !j.url) return Promise.reject('心跳数据无效');
  if (!j.alive) { showMaint(); return; }
  var age = Date.now() - (j.ts || 0);
  if (age > 180000) { showMaint(); return; } /* 心跳超过3分钟 = 服务器可能已关 */
  location.replace(j.url + '/');
}

function check() {
  fetch(HEARTBEAT_URL, { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : Promise.reject('心跳文件不可用'); })
    .then(goto)
    .catch(function () {
      /* API 不通: 试 raw CDN(国内访问 raw 有时更顺) */
      return fetch('https://raw.githubusercontent.com/1950558292a/xinyue-heartbeat/main/heartbeat.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : Promise.reject('raw不可用'); })
        .then(goto)
        .catch(function () {
          if (Date.now() - start < MAX_WAIT) setTimeout(check, 3000);
          else showMaint();
        });
    });
}
setTimeout(function () { showMaint(); }, MAX_WAIT + 10000);
check();
</script>
</body>
</html>
