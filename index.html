<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心悦量化平台 · 正在连接…</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d1117; color: #e6edf3;
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    text-align: center; padding: 20px;
  }
  .box { max-width: 420px; }
  .logo { font-size: 52px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  .status { color: #8b98a9; font-size: 13px; min-height: 20px; margin-top: 10px; }
  .spinner {
    width: 30px; height: 30px; margin: 18px auto; border: 3px solid #232d3d;
    border-top-color: #3d8bff; border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .maint { color: #e6543e; font-size: 15px; font-weight: 700; }
  .tip { color: #8b98a9; font-size: 12px; margin-top: 14px; }
  a { color: #3d8bff; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">◈</div>
  <h1>心悦量化平台</h1>
  <div class="spinner" id="spin"></div>
  <div class="status" id="status">正在连接服务器…</div>
  <div class="tip">如果长时间无反应，请检查服务器电脑是否已开机并运行服务，或稍后重试。<br>同一 WiFi 下可直接访问 http://192.168.1.7:8080</div>
</div>
<script>
/* 固定跳转页 v2: 多数据源(jsdelivr→GitHub API→raw) + 跳转前存活验证 + 永不放弃重试 */
var OWNER = '1950558292a';
var SOURCES = [
  'https://cdn.jsdelivr.net/gh/' + OWNER + '/xinyue-heartbeat@main/heartbeat.json?t=',
  'https://api.github.com/repos/' + OWNER + '/xinyue-heartbeat/contents/heartbeat.json?t=',
  'https://raw.githubusercontent.com/' + OWNER + '/xinyue-heartbeat/main/heartbeat.json?t=',
];
var tries = 0, lastUrl = '';

function showMaint(msg) {
  document.getElementById('spin').style.display = 'none';
  document.getElementById('status').innerHTML =
    '<div class="maint">暂时无法连接服务器</div>' + (msg || '') +
    '<div style="font-size:12px;color:#8b98a9;margin-top:8px">仍在自动重试，请保持此页面打开…</div>';
}

function decodeApiResp(j) {
  if (j && j.content) {
    try {
      var bin = atob(j.content.replace(/\n/g, ''));
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder('utf-8').decode(bytes));
    } catch (e) { return null; }
  }
  return j && (j.url || j.ts) ? j : null;
}

/* 拿到地址后先验证服务器真活着, 再跳转(避免跳到已失效的旧隧道) */
function probeAndGo(j) {
  var hb = decodeApiResp(j);
  if (!hb || !hb.url) return Promise.reject('心跳数据无效');
  if (!hb.alive) { showMaint('服务器已关机或服务未启动。'); return Promise.reject('not alive'); }
  var age = Date.now() - (hb.ts || 0);
  if (age > 240000) { showMaint('心跳已过期(服务器可能已关机)。'); return Promise.reject('stale'); }
  if (hb.url === lastUrl) { /* 地址没变过且验证过, 直接进 */ location.replace(hb.url + '/'); return Promise.resolve(); }
  return fetch(hb.url + '/api/info', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) return Promise.reject('服务器无响应');
      return r.json();
    })
    .then(function (info) {
      if (!info || !info.ok) return Promise.reject('服务器无响应');
      lastUrl = hb.url;
      location.replace(hb.url + '/');
    });
}

function check() {
  tries++;
  var st = document.getElementById('status');
  if (tries > 1) st.textContent = '正在连接服务器…(第 ' + tries + ' 次尝试)';
  var src = SOURCES[(tries - 1) % SOURCES.length] + Date.now();
  fetch(src, { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : Promise.reject('数据源不可用'); })
    .then(probeAndGo)
    .catch(function (e) {
      /* 30秒内快速重试, 之后每10秒一次(永不放弃) */
      var wait = Date.now() - window.__t0 < 30000 ? 3000 : 10000;
      setTimeout(check, wait);
    });
}
window.__t0 = Date.now();
check();
</script>
</body>
</html>
